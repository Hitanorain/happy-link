<script>
'use strict';
const VERSION = 'v1.0';
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const rint = n => Math.floor(Math.random() * n);
const pick = a => a[rint(a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rint(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

      <li><span>💡</span><span>提示找一对能连的，🔀 重排打乱位置，💣 炸弹直接炸掉一对。</span></li>
    </ul>
    <div class="mbtns"><button class="btn mint" data-act="ok">知道啦</button></div>`, () => { closeModal(); if (onClose) onClose(); });
}

// ---------- 弹窗 / 提示 / 页面切换
let modalCb = null;
function modal(html, cb) {
  const m = $('modal'); m.innerHTML = `<div class="mcard withribbon">${html}</div>`; modalCb = cb;
  m.classList.add('on');
}
$('modal').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b || !modalCb) return; Snd.sfx('click'); modalCb(b.dataset.act, b); });
function closeModal() { $('modal').classList.remove('on'); modalCb = null; }
let toastTimer = 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2000); }
function show(id) { for (const s of document.querySelectorAll('.screen')) s.classList.toggle('on', s.id === id); }

function isUnlocked(L) { return L === 0 || (save.stars[L - 1] || 0) > 0; }
function openMap() {
  closeModal(); S.playing = false; S.paused = false; Snd.setHurry(false);
  show('map'); setTheme(TITLE_SKY); Snd.play('title');
  let total = 0, cur = -1;
  const html = WORLDS.map((w, wi) => {
    let ws = 0;
    const lv = Array.from({ length: PER_WORLD }, (_, k) => {
      const L = wi * PER_WORLD + k, st = save.stars[L] || 0, un = isUnlocked(L); ws += st;
      if (un && !st && cur < 0) cur = L;
      if (!un) return `<button class="lv lock" disabled aria-label="第 ${k + 1} 关（未解锁）"><b>🔒</b></button>`;
      return `<button class="lv ${!st ? 'cur' : ''}" data-l="${L}" aria-label="第 ${k + 1} 关">${k === PER_WORLD - 1 ? '<span class="crown">👑</span>' : ''}<b>${k + 1}</b><span class="st">${[0, 1, 2].map(i => `<i class="${i < st ? 'on' : ''}">★</i>`).join('')}</span></button>`;
    }).join('');
    total += ws;
    const open = isUnlocked(wi * PER_WORLD);
    return `<div class="world ${w.dark ? 'dark' : ''}" id="w${wi}" style="--a:${w.accent};--s0:${w.sky[0]};--s1:${w.sky[2]}">
      <div class="wh"><span class="wi">${w.icon}</span><div><h3>${wi + 1}. ${w.name}</h3><small>${w.en} · ★ ${ws}/${PER_WORLD * 3}</small></div></div>
      <div class="lvls">${lv}</div>${open ? '' : '<div class="wlock">🔒 通关上一个世界就能解锁</div>'}</div>`;
  }).join('');
  $('worlds').innerHTML = html;
  $('starTotal').textContent = `★ ${total} / ${NLEVELS * 3}`;
  const target = $('w' + Math.floor((cur < 0 ? NLEVELS - 1 : cur) / PER_WORLD));
  requestAnimationFrame(() => { const box = $('worlds'); box.scrollTop = Math.max(0, target.offsetTop - box.offsetTop - 8); });
}
$('worlds').addEventListener('click', e => { const b = e.target.closest('.lv[data-l]'); if (!b) return; Snd.sfx('click'); startLevel(+b.dataset.l); });
$('btnPlay').addEventListener('click', () => { Snd.sfx('click'); openMap(); });
$('mapBack').addEventListener('click', () => { Snd.sfx('click'); show('title'); });
$('btnHelp').addEventListener('click', () => { Snd.sfx('click'); showHelp(); });
function syncToggles() { $('btnMusic').classList.toggle('off', !save.music); $('btnSfx').classList.toggle('off', !save.sfx); }
$('btnMusic').addEventListener('click', () => { Snd.setMusic(!save.music); syncToggles(); Snd.sfx('click'); });
$('btnSfx').addEventListener('click', () => { Snd.setSfx(!save.sfx); syncToggles(); Snd.sfx('click'); });
syncToggles();
$('ver').textContent = VERSION;

// 浏览器要求用户先点一下才能出声
document.addEventListener('pointerdown', () => Snd.unlock(), true);
document.addEventListener('keydown', e => { Snd.unlock(); if (e.key === 'Escape' && $('game').classList.contains('on')) pause(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (S.playing && !S.paused) pause(); Snd.suspend(); } else if (Snd.ready) Snd.resume();
});
Snd.play('title');

// 屏幕转向时（比如平板横竖切换）把整盘方块也转过来
function transposeBoard() {
  const t = a => Array.from({ length: C + 2 }, (_, c) => Array.from({ length: R + 2 }, (_, r) => a[r][c]));
  G = t(G); VALID = t(VALID); STONE = t(STONE); [C, R] = [R, C]; GRAV = GRAV && TRANS[GRAV];
  for (const tl of allTiles()) { [tl.r, tl.c] = [tl.c, tl.r]; [tl.px, tl.py] = [tl.py, tl.px]; }
  S.dying = []; FX.links = [];
  if (GRAV) { const n = $('lvName'); n.textContent = n.textContent.replace(/ \S+$/, ' ' + GRAV_ICON[GRAV]); }
}
addEventListener('resize', () => {
  sizeCanvases();
  if (S.def && $('game').classList.contains('on')) { const a = boardArea(); if (fitCell(R, C, a) > fitCell(C, R, a) * 1.15) transposeBoard(); layout(); }
});
sizeCanvases(); initTheme();
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if ($('game').classList.contains('on')) { updateTiles(dt); updateTimer(dt, now); }
  drawBg(dt, now); drawBoard(now); drawFx(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
